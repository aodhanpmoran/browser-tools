<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Browser Tools</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <nav class="nav" id="nav"></nav>

    <div class="page" id="page-home">
      <div class="page-body">
        <h2 class="page-title">Features</h2>
        <ul id="feature-list" class="feature-list"></ul>
        <div id="recently-closed-section" hidden>
          <div class="section-head">
            <h2 class="page-title">Recently closed</h2>
          </div>
          <ul id="recently-closed" class="closed-list"></ul>
        </div>
      </div>
    </div>

    <div class="page" id="page-cookies" hidden>
      <div class="page-body">
        <div id="cookies-summary" class="cookies-summary"></div>
      </div>
    </div>

    <div class="page" id="page-redirects" hidden>
      <div class="page-body">
        <div id="redirect-summary" class="redirect-summary"></div>
      </div>
    </div>

    <div class="page" id="page-music" hidden>
      <div class="page-body">
        <div id="now-playing-panel" class="np-panel"></div>
      </div>
    </div>

    <div class="page" id="page-pip" hidden>
      <div class="page-body">
        <div id="pip-panel" class="pip-panel"></div>
      </div>
    </div>

    <div class="toolbar">
      <button id="open-options" type="button" class="toolbar-btn" title="Settings">
        <span class="toolbar-icon">⚙</span>
        <span class="toolbar-label">Settings</span>
      </button>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
